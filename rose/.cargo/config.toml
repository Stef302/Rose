# Configuration de compilation du moteur Rose.
#
# Lien statique sur les cibles Linux GNU (aarch64 / x86_64) :
#
#   * le binaire Rose est lié dynamiquement par défaut, ce qui coûte ~0,3 ms
#     à CHAQUE lancement (7 392 relocations à traiter par le chargeur
#     dynamique, contre 459 pour un binaire Rust minimal) ;
#   * le lien statique supprime ce surcoût : le banc complexe gagne
#     ~0,25 ms par exécution, et le démarrage seul ~0,11 ms (mesuré en
#     salve alternée Rose/Rust, 40 tours entrelacés) ;
#   * le FFI Rose (`@dll`/`@sym` → dlopen) reste fonctionnel : glibc
#     implémente dlopen sur les binaires statiques (vérifié avec
#     `exemples/ffi_libm.rose`).
#
# Les cibles Windows (gnullvm/msvc) et WebAssembly ne sont PAS concernées :
# `target.<triple>.rustflags` ne s'applique qu'à la triple indiquée, et le
# WASM est déjà statique par construction.
#
# ── DÉCISION MESURÉE du 23/11/2026 (vague OPT WALL FINALE) ────────────────
# Trois leviers de l'éditeur de liens ont été testés en A/B/A entrelacé
# (21 lots, pin cœur 15, sha binaire vérifié, perf_counter_ns) contre le
# binaire témoin ci-dessous (static-pie, BIND_NOW, 6 275 RELATIV + 5
# IRELATIVE). Détails et chiffres : `docs/OPT_WALL_FINAL.md`.
#
#   * `-C relocation-model=static` (non-PIE, 0 RELATIV) : −0,06 à −0,11 ms
#     sur `rose version` (démarrage PUR) mais +0,01 à +0,05 ms sur les
#     domaines du banc qui EXÉCUTENT un programme — la préparation JIT
#     (~0,2 ms médian) écrase le gain. REJETÉ : de plus l'ASLR est perdue.
#   * `-Wl,-z,lazy` (BIND_NOW retiré) : −0,06 à −0,09 ms sur `version`,
#     neutre/slower sur l'exécution. REJETÉ (gain non reproductible sur le
#     mur du banc).
#   * `-Wl,-z,pack-relative-relocs` via lld (6 275 RELA → 246 entrées RELR)
#     : +0,03 à +0,07 ms sur l'exécution, et lld ignore l'option avec GNU ld.
#     REJETÉ : régression mesurée.
#
# Le `-rdynamic` de build.rs est un NO-OP mesuré en static-pie (binaire
# bit-identique, sha 8896ace2… , `.dynsym` = 3 entrées) : le JIT enregistre
# déjà ses symboles par adresse (cf. `jit.rs::table_symboles_runtime`).
# Aucun de ces leviers n'est donc appliqué : on GARDE static-pie + BIND_NOW,
# qui préserve l'ASLR et la protection RELRO complète.

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-feature=+crt-static"]

# ── Tests : `cargo t` au lieu de `cargo test` ────────────────────────────
#
# `[lib]` déclare `crate-type = ["cdylib", "rlib"]` (le cdylib produit le
# module WebAssembly). Sur une cible qui SUPPORTE cdylib (x86_64 Linux,
# macOS, Windows), `cargo test` exécute le cdylib comme harnais de test de
# la lib — or une bibliothèque partagée n'a PAS de point d'entrée : le
# processus meurt en SIGSEGV avant le premier test (mesuré sur la CI
# x86_64, rustc 1.100).
#
# `src/main.rs` déclare EXACTEMENT les mêmes modules que `lib.rs` (même
# liste de `mod`, mêmes `#[path]`) : `--bins` y exécute donc les 52 tests
# de la lib + ceux des binômes (rose-aot 12, rose-shell 47).
#
# L'alias rend l'usage sûr sur toutes les plateformes :
#     cargo t --release
[alias]
t = "test --bins"

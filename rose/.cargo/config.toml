# Configuration pour la compilation croisée x86_64 depuis aarch64
# Prérequis sur la machine de build : gcc-x86-64-linux-gnu + libc6-dev-amd64
# (ou un sysroot x86_64 complet avec fichiers de développement)

[target.x86_64-unknown-linux-gnu]
linker = "x86_64-linux-gnu-gcc"

[package]
name = "rose"
version = "2.0.3"
edition = "2024"

[[bin]]
name = "rose"
path = "src/main.rs"

[dependencies]
cranelift = { version = "0.137", default-features = false, features = ["jit", "frontend", "module", "native"] }
libc = "0.2"
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
inkwell = { version = "0.7", optional = true, features = ["llvm18-1-prefer-dynamic", "target-aarch64", "target-x86", "no-libffi-linking"] }

[build-dependencies]
cc = "1.0"

[features]
# Le binaire par défaut est LÉGER : pas de LLVM, pas de libLLVM.so au
# démarrage (5 ms de moins à chaque lancement) et 4,8 Mo au lieu de 5,2 Mo.
# La chaîne AOT (commandes `rose llvm` / `orc` / `link`) exige :
#     cargo build --release --features llvm
default = []
llvm = ["dep:inkwell"]

[profile.release]
opt-level = 3
strip = true

[profile.release-dbg]
inherits = "release"
debug = 2
strip = false


[package]
name = "rose"
version = "2.0.0"
edition = "2024"

[[bin]]
name = "rose"
path = "src/main.rs"

[dependencies]
cranelift = { version = "0.137", default-features = false, features = ["jit", "frontend", "module", "native"] }
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
inkwell = { version = "0.7", features = ["llvm18-1-prefer-dynamic", "target-aarch64", "target-x86"], optional = true }

[build-dependencies]
cc = "1.0"

[features]
llvm-aot = ["dep:inkwell"]

default = ["llvm-aot"]

[profile.release]
opt-level = 2
strip = true

[profile.release-dbg]
inherits = "release"
debug = 2
strip = false


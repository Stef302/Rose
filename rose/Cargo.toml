[package]
name = "rose"
version = "0.1.4"
edition = "2024"

# Bibliothèque : le moteur est utilisable depuis Rust… et compilé en
# WebAssembly (voir docs/WASM.md). Le crate-type « cdylib » produit le
# module .wasm ; « rlib » garde l'usage depuis Rust.
[lib]
name = "rose"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "rose"
path = "src/main.rs"
required-features = ["native"]

# Helper AOT : la chaîne LLVM vit dans un binaire séparé, que le binaire
# principal télécharge à la demande (voir src/auto_llvm.rs).
[[bin]]
name = "rose-aot"
path = "src/bin/rose-aot.rs"
required-features = ["native"]

# Installeur graphique autonome (Windows) : fenêtre Win32 de setup_gui,
# publiée sous le nom « Rose-win-Setup.exe ». Velopack empaquette ensuite
# le dossier `stage` (moteur + cet installeur + payload).
# (Windows uniquement : setup_gui est #[cfg(windows)], le binôme ne
# s'énumère pas sur Linux/macOS et ne casse pas `cargo test`.)
[[bin]]
name = "rose-setup"
path = "src/bin/rose-setup.rs"
required-features = ["native"]

[dependencies]
num-bigint = "0.4"
num-integer = "0.1"
num-rational = "0.4"
num-traits = "0.2"
libc = "0.2"
inkwell = { version = "0.7", optional = true, features = ["llvm18-1-prefer-dynamic", "target-aarch64", "target-x86", "no-libffi-linking"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cranelift = { version = "0.137", default-features = false, features = ["jit", "frontend", "module", "native"] }

[build-dependencies]
cc = "1"

[features]
default = ["native"]
native = []
wasm = []
llvm = ["dep:inkwell"]

[profile.release]
opt-level = 3
strip = true

[profile.release-dbg]
inherits = "release"
debug = 2
strip = false

# Profil dédié au WebAssembly : LTO + un seul codegen-unit = un .wasm
# nettement plus petit (579 Ko au lieu de 653 Ko) et aussi rapide.
#
# `panic` n'est PAS réglé ici, et c'est VOLONTAIRE :
#   * `panic = "abort"` est INTERDIT : il casserait `catch_unwind`, donc les
#     erreurs runtime Rose ET le `essayer`/`attraper` du langage ;
#   * `panic = "unwind"` est sans effet sur les cibles wasm : leur
#     spécification de cible IMPOSE `abort` (rustc refuse `-C panic=unwind`
#     sur wasm32-unknown-unknown et wasm32-wasip1) ;
#   * en laissant la stratégie par défaut, le natif reste en « unwind »
#     (défaut de la crate) et le WASM en « abort » (imposé par la cible).
# Le message d'erreur n'est pas perdu pour autant : le hook de panique
# (src/wasm.rs) le range avant l'arrêt et le glue JS le relit.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true

[package]
name = "rose"
version = "0.1.7"
edition = "2024"
# ⚠ Les binaires sont déclarés explicitement ci-dessous. `autobins = false`
# empêche Cargo d'auto-découvrir `src/bin/rose_nostd.rs` (démo M5.3 no_std,
# qui exige panic=abort et ne doit PAS être compilé avec le moteur std).
autobins = false

# Bibliothèque : le moteur est utilisable depuis Rust… et compilé en
# WebAssembly (voir docs/WASM.md). Le crate-type « cdylib » produit le
# module .wasm ; « rlib » garde l'usage depuis Rust.
[lib]
name = "rose"
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "rose"
path = "src/main.rs"
# ⚠ G2 : le binaire est disponible dans DEUX configurations mutuellement
# exclusives :
#   * --features native (= défaut) : moteur + JIT Cranelift (comportement
#     historique, inchangé) ;
#   * --no-default-features --features autonome : moteur SANS Cranelift,
#     émetteur machine natif M3.1 pour le sous-ensemble couvert et repli
#     interpréteur pour le reste.
# `required-features` est un ET logique : on ne peut donc pas y mettre
# `["native", "autonome"]`. La feature `binaire`, activée par les deux, sert
# de garde (et continue d'empêcher la compilation du binaire sur une cible
# wasm où seul le module `--lib` est voulu).
required-features = ["binaire"]

# ⚠ `rose-aot` n'est PLUS un binaire séparé : sa fonctionnalité (orc/link)
# est intégrée directement dans `rose.exe` (sous-commandes `rose orc` et
# `rose link`, voir src/main.rs). Le fichier src/bin/rose-aot.rs est conservé
# à titre d'archive mais n'est plus compilé.
#
# Installeur graphique autonome (Windows) : fenêtre Win32 de setup_gui,
# publiée sous le nom « Rose-win-Setup.exe ». Velopack empaquette ensuite
# le dossier `stage` (moteur + cet installeur + payload).
# (Windows uniquement : setup_gui est #[cfg(windows)], le binôme ne
# s'énumère pas sur Linux/macOS et ne casse pas `cargo test`.)
[[bin]]
name = "rose-setup"
path = "src/bin/rose-setup.rs"
required-features = ["native"]

# Console interactive autonome (« shell » de Rose). Binaire séparé pour être
# installé à côté du moteur et lancé comme un shell : rose-shell [fichier].
#
# Ce n'est qu'un LANCEUR (≈ 300 Ko) : il localise `rose.exe` et lui délègue
# `rose console`. Il ne dépend donc PAS de la feature `native` et ne
# recompile pas le moteur — le langage n'est embarqué qu'une seule fois.
[[bin]]
name = "rose-shell"
path = "src/bin/rose-shell.rs"

# ⚠ M5.3 / G3 — src/bin/rose_nostd.rs n'est PAS câblé ici : il exige
# `panic = "abort"` alors que le profil release du moteur DOIT rester
# `panic = "unwind"` (catch_unwind, voir commentaire l.85). Le binaire est
# donc compilé dans un harnais isolé (voir docs/BINAIRE_NO_STD.md).

[dependencies]
num-bigint = "0.5"
num-integer = "0.1"
# `num-rational` n'est importé nulle part dans le moteur : il ne servait qu'à
# tirer une SECONDE version de `num-bigint` (0.4.8) dans le binaire. Les
# rationnels de Rose sont des types internes (`i128x`, `latex`), pas des
# `Ratio<BigInt>`. Dépendance retirée : une seule version de `num-bigint`.
num-traits = "0.2"
libc = { version = "0.2", default-features = false }
inkwell = { version = "0.7", optional = true, features = ["llvm18-1-prefer-dynamic", "target-aarch64", "target-x86", "no-libffi-linking"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# ⚠ G2 — Cranelift est OPTIONNEL. Il n'est tiré que par la feature `jit`
# (via `dep:cranelift`), activée par `native` = défaut. La configuration
# `--no-default-features --features autonome` ne le compile PAS du tout :
# c'est ce qui fait tomber `libc feature "default"/"std"` du graphe.
cranelift = { version = "0.137", default-features = false, features = ["jit", "frontend", "module", "native"], optional = true }

[build-dependencies]
cc = "1"

[features]
default = ["native"]
# Configuration HISTORIQUE (inchangée) : JIT Cranelift + binaire natif.
native = ["jit", "binaire"]
# Feature technique : tire uniquement la dépendance Cranelift.
jit = ["dep:cranelift"]
# ⚠ G2 — configuration AUTONOME : ZÉRO Cranelift. Le module `jit` est alors
# remplacé par un shim de même API qui compile le sous-ensemble émettable
# (boucles arithmétiques sur i64/booléens, sans appel à une autre fonction
# Rose) via l'émetteur machine M3.1, et laisse TOUT le reste à l'interpréteur.
autonome = ["binaire"]
# Garde commune aux deux binaires natifs (voir [[bin]] rose ci-dessus).
binaire = []
wasm = []
llvm = ["dep:inkwell"]

[profile.release]
opt-level = 3
strip = true
# ⚠ CLOSE1 — LTO grasse + une seule unité de codegen (constat daté 20/11/2026).
# Salve A/A/A définitive, 21 rotations entrelacées, différences appariées
# (mesure moins sensible à la dérive que les médianes marginales) :
# fin - témoin = -57 µs (c6), -80 µs (c16), -22 µs (c19). Taille du binaire :
# 5 587 928 -> 4 932 512 octets. Aucun changement de sémantique : sortie
# bit-identique (md5 ba144f964dc4b8775b176c31205c98fd). Ces deux réglages
# sont portables (aucune option de CPU, aucun target-feature) : le repli
# générique est toujours `cargo build --release` tel quel. Voir CLOSURE.md.
lto = "fat"
codegen-units = 1

[profile.release-dbg]
inherits = "release"
debug = 2
strip = false

# Profil dédié au WebAssembly : LTO + un seul codegen-unit = un .wasm
# nettement plus petit (579 Ko au lieu de 653 Ko) et aussi rapide.
#
# `panic` n'est PAS réglé ici, et c'est VOLONTAIRE :
#   * `panic = "abort"` est INTERDIT : il casserait `catch_unwind`, donc les
#     erreurs runtime Rose ET le `essayer`/`attraper` du langage ;
#   * `panic = "unwind"` est sans effet sur les cibles wasm : leur
#     spécification de cible IMPOSE `abort` (rustc refuse `-C panic=unwind`
#     sur wasm32-unknown-unknown et wasm32-wasip1) ;
#   * en laissant la stratégie par défaut, le natif reste en « unwind »
#     (défaut de la crate) et le WASM en « abort » (imposé par la cible).
# Le message d'erreur n'est pas perdu pour autant : le hook de panique
# (src/wasm.rs) le range avant l'arrêt et le glue JS le relit.
[profile.wasm-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true
